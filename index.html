<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tienda - Productos (Vista preliminar)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="nav">
    <div class="user-panel">
        <strong>Usuario: <span id="nombreUsuario">Invitado</span></strong>
        <input type="text" id="nuevoUsuarioInput" placeholder="Cambiar a otro usuario...">
        <button class="btn-warning">Cambiar Sesión</button>
    </div>
    <div>
        <a href="carrito.html">Ir al Carrito (<span id="contadorCarrito">0</span>)</a>
    </div>
</div>

<h2>Lista de Productos</h2>

<div id="listaProductos" class="productos-container">

    <!-- Datos de ejemplo para la vista preliminar -->
    <div class="producto">
        <h3>Producto de ejemplo 1</h3>
        <p>Precio: $100.00</p>
        <p>Stock: 10</p>
        <button class="btn-agregar">Añadir al carrito</button>
    </div>

    <div class="producto">
        <h3>Producto de ejemplo 2</h3>
        <p>Precio: $250.00</p>
        <p>Stock: 5</p>
        <button class="btn-agregar">Añadir al carrito</button>
    </div>

    <div class="producto">
        <h3>Producto de ejemplo 3</h3>
        <p>Precio: $75.50</p>
        <p>Stock: 20</p>
        <button class="btn-agregar">Añadir al carrito</button>
    </div>

</div>

</body>
</html>
